# RLPS reference resolver — the embeddable crate that any application links to load
# .r14n.toml packs and resolve (profile, jurisdiction, subject) -> required controls.
# Extracted VERBATIM from the Squillo OS regulatory-policy engine (the live existence
# proof); fully generic (serde + toml + std only, ZERO Squillo deps).
#
# License: Apache-2.0 (code). The spec text + schemas are CC BY 4.0 (see /LICENSE-SPEC).

[package]
name = "r14n"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "RLPS reference resolver — jurisdiction-negotiated, fail-closed regulatory-policy packs (r14n : controls :: i18n : strings)"
repository = "https://github.com/squillo/r14n"
keywords = ["compliance", "policy", "regulatory", "consent", "localization"]
categories = ["config", "internationalization"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

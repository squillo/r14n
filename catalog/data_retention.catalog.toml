# RLPS Control Catalog — domain: data_retention
#
# The canonical, jurisdiction-neutral declaration of the control keys a data-retention
# pack may reference, each with a deontic KIND and a title. Packs reference these keys;
# they do NOT redefine them. NOT LEGAL ADVICE — a control is a stable identifier for a
# required (or forbidden) action, not a statement of any jurisdiction's law. **RLPS does
# not prescribe a retention period**: that is the deploying operator's decision under
# applicable law (/docs/receipt-data-handling.md), and no key here encodes a duration.
# See /docs/not-legal-advice.md.
#
# kind ∈ { permit | obligation | prohibition }
#
# ── WHY THIS CATALOG EXISTS ─────────────────────────────────────────────────
#
# Same reason as data_residency: this domain's packs are maintained by a consuming
# application, and until this file existed they referenced control keys that no catalog
# declared — so a typo'd or retired key resolved silently instead of failing lint
# (invariant 11). It ships no packs; a pack naming a real regime is counsel-gated
# (invariant 2).
#
# ⚠ `kind` is DOCUMENTATION today — nothing enforces it; `r14n validate` keys off
# catalog MEMBERSHIP alone. The values are derived from shipped precedent exactly as in
# the data_residency catalog: every key below appears in a requirement table of a
# shipped pack, so none can be a `prohibition`, and the `*_permitted` key follows the
# `aph_mandate_principal_signed` permit precedent. See that file's header for the full
# derivation.
#
# ── NO KEY HERE NAMES A DURATION, AND THAT IS DELIBERATE ────────────────────
#
# A control key is opaque and carries no value. A key per retention window would put
# policy in the vocabulary and would need a new key every time a window changed, so the
# window lives in the enforcing layer's configuration and the key below asserts only
# that the bound was consulted and applied. The same reasoning is spelled out for
# `secret_assurance_floor` in the credential_use catalog.
#
# ── THE COLLECTION-BASIS KEYS MOVED OUT, 2026-10-21 ─────────────────────────
#
# `usage_analytics_opt_in` and `external_agent_harvest_permitted` now live in the
# `analytics_consent` domain: consent to COLLECT and a bound on how long you KEEP are
# different questions, and sharing a domain made them share a floor. They are retained
# below as DEPRECATED rather than deleted, because a control key is long-lived audit
# evidence (invariant 10) and receipts already issued name them in THIS domain. A key is
# namespaced by its owning domain (spec §2.1), so the keys in `analytics_consent` are
# different keys that share a spelling — not the same key seen from elsewhere.
#
# ⚠⚠ THE MOVE EMPTIES THE LEAST-RESTRICTIVE FLOOR, AND AN EMPTY FLOOR IS NOT EMPTY.
#
# The shipped `minimal` pack for this domain has exactly ONE floor control,
# `usage_analytics_opt_in` — the key that moved. Its one remaining subject
# (`contacts_audit`) uses a DIFFERENT control, so removing the moved key leaves the floor
# empty. A `minimal` pack with an empty `[legally_required]` does NOT resolve to "nothing
# required": it fails closed to the caller's entire universe with `fell_back = true`,
# discarding the pack whole. Pinned by `minimal_pack_empty_floor_fails_closed`.
#
# So the lane performing the move MUST give that pack a new floor in the same change.
# `contacts_audit_retention_enforced` is the only control its remaining subject uses,
# which makes it the sole candidate — but a floor is what counsel confirmed as the
# minimum, so this file names the candidate and does not choose it.
#
# ⚠ One gap this file records rather than fixes: the shipped packs for this domain carry
# NO backup, archive, or export subject, so the retention of a database dump or a bulk
# export is not governed by any control here. Nothing in this catalog should be read as
# covering it.

[domain]
name = "data_retention"
description = "Controls governing HOW LONG data may be kept and on what basis it was collected — the retention bound applied to a record set, and the consent or authorization its collection rests on."

# ── Obligations — a state the enforcing gate must bring about ────────────────

[control.contacts_audit_retention_enforced]
kind = "obligation"
title = "Contact-audit retention enforced"
description = "The contact-audit record set is held under an enforced retention bound and pruned when it lapses. The bound's length lives in the enforcing layer's configuration; this control asserts it was consulted and applied, and deliberately encodes no duration."

[control.usage_analytics_opt_in]
kind = "obligation"
title = "Usage analytics opt-in held (DEPRECATED — moved to analytics_consent)"
description = "DEPRECATED 2026-10-21: the collection-basis controls moved to the `analytics_consent` domain so a consent gate resolves one domain rather than two. Retained because receipts already issued name this key in THIS domain and a control key is long-lived audit evidence. MUST NOT be used in new data_retention packs. Use the `analytics_consent` key of the same spelling."
deprecated = "2026-10-21"
superseded_by = ["analytics_consent::usage_analytics_opt_in"]

# ── Permits — a named authorization the actor must hold ─────────────────────

[control.external_agent_harvest_permitted]
kind = "permit"
title = "External-agent harvest permitted (DEPRECATED — moved to analytics_consent)"
description = "DEPRECATED 2026-10-21: moved to the `analytics_consent` domain with the other collection-basis controls. Retained as long-lived audit evidence; MUST NOT be used in new data_retention packs. Use the `analytics_consent` key of the same spelling."
deprecated = "2026-10-21"
superseded_by = ["analytics_consent::external_agent_harvest_permitted"]

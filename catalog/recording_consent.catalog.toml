# RLPS Control Catalog — domain: recording_consent
#
# The canonical, jurisdiction-neutral declaration of the control keys a recording-
# consent pack may reference, each with a deontic KIND and faceted sub-fields. Packs
# reference these keys; they do NOT redefine them. NOT LEGAL ADVICE — a control is a
# stable identifier for a required action, not a statement of any jurisdiction's law.
#
# kind ∈ { permit | obligation | prohibition }

[domain]
name = "recording_consent"
description = "Controls governing whether and how a meeting/audio session may be recorded."

[control.attestation]
kind = "obligation"
title = "Recording-consent attestation"
description = "The recording party affirms they have consent / a lawful right to record."
trigger = "before_capture"
mechanism = "explicit_user_affirmation"
subject_rights = ["withdraw"]
legal_basis_hint = "one_party_or_all_party_consent"

[control.signal_notice]
kind = "obligation"
title = "Recording signal active"
description = "The conference recording signal is verified active to all participants."
trigger = "before_capture"
mechanism = "platform_verified_signal"

[control.indicator_mount]
kind = "obligation"
title = "Local recording indicator mounted"
description = "The local recording indicator is verified visible to the recording user."
trigger = "before_capture"
mechanism = "ui_verified_indicator"

[control.announcement]
kind = "obligation"
title = "Notetaker-present announcement"
description = "An in-meeting announcement that a recording/notetaking agent is present."
trigger = "on_join"
mechanism = "in_meeting_notice"

# ── Delegate/agent authorization (APH-backed) ────────────────────────────────
#
# APH distinguishes two trust models that are NOT interchangeable, so RLPS gives
# them two control keys. A control key is long-lived audit evidence; one key
# satisfiable by either model would record that SOMETHING authorized the act while
# concealing whether a human ever signed anything — the badge-collapse APH's
# security considerations §2.6 exists to prevent. Full rationale, citations, and
# the enforcement-gate contract: /docs/aph-integration.md. NOT LEGAL ADVICE.
#
# Neither key supplies any OTHER participant's consent: a mandate authorizes an
# agent to act for ITS OWN principal. All-party consent is `attestation` /
# `announcement` / `signal_notice`.

[control.aph_mandate_principal_signed]
kind = "permit"
title = "Delegate mandate — principal-signed"
description = "An APH envelope passing APH spec §8.3 verification with attestationMode = PrincipalSigned, evaluated at decision time with a live revocation-status check. The principal's own key signed this act: consent, cryptographically."
trigger = "before_capture"
mechanism = "authorization_grant"
verified_by = "aph:0.1#8.3"
attestation_mode = "PrincipalSigned"

[control.aph_mandate_notary_attested]
kind = "permit"
title = "Delegate mandate — notary-attested"
description = "An APH envelope passing APH spec §8.3 verification with attestationMode = NotaryAttested (or absent), evaluated at decision time with a live revocation-status check. A notary ASSERTS the human authorized this; the human's key never touched the envelope — provenance, not consent. A pack requiring human consent MUST require the principal-signed key instead."
trigger = "before_capture"
mechanism = "authorization_grant"
verified_by = "aph:0.1#8.3"
attestation_mode = "NotaryAttested"

[control.aph_mandate]
kind = "permit"
title = "Delegate/agent authorization mandate (DEPRECATED — ambiguous)"
description = "DEPRECATED 2026-08-24: ambiguous between APH's two attestation modes, so a receipt naming it cannot tell an auditor whether a human signed anything. Retained because a control key is long-lived audit evidence and shipped receipts reference it; MUST NOT be used in new packs. Use aph_mandate_principal_signed (consent) or aph_mandate_notary_attested (provenance)."
trigger = "before_capture"
mechanism = "authorization_grant"
deprecated = "2026-08-24"
superseded_by = ["aph_mandate_principal_signed", "aph_mandate_notary_attested"]

# ── Reserved for future domains (declared, not yet used by shipped packs) ──
# ai_disclosure  (EU AI Act Art.50 — obligation; trigger=before_capture; mechanism=ai_notice)
# voice_biometric (GDPR Art.9 special-category gate — obligation; SEPARATE from recording)
# data_retention (obligation; retention window + deletion path)

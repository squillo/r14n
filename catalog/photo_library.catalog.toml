# RLPS Control Catalog — domain: photo_library
#
# The canonical, jurisdiction-neutral declaration of the control keys a photo_library pack
# may reference, each with a deontic KIND and a title. Packs reference these keys; they do
# NOT redefine them. NOT LEGAL ADVICE — a control is a stable identifier for a required
# action, not a statement of any jurisdiction's law. See /docs/not-legal-advice.md.
#
# kind ∈ { permit | obligation | prohibition }
#
# ── WHY THIS CATALOG EXISTS ─────────────────────────────────────────────────
#
# `r14n Spec/1.0.0/smoke_tests` ships typed `photo_library` packs, and their control keys were
# declared by NO catalog until this file. Two guards both missed it, and the overlap of
# their blind spots is exactly this file's shape: the CI pack lint globs
# `packs/*.r14n.toml` (these are Snapp nodes, not published TOML), and
# `catalog_integrity.rs`'s Snapp cross-check reads EMITTED bundles (these packs are
# `#[cfg(test)]` and never emitted). Scott ruled 2026-10-26 that these are real domains
# rather than fixtures, so they get catalogs.
#
# ── THESE ARE PLATFORM MECHANICS, NOT A REGULATORY REGIME ───────────────────
#
# The aggressive pack declares `legal_review { status = "not_required" }` and the minimal
# one `requires_signoff`; both are correct rather than omissions. Every key below names a
# platform permission mechanism, not an obligation drawn from any privacy regime. A pack
# claiming such a regime needs a named attorney of record (invariant 2) and these are not
# those packs. ⚠ Nothing here is a privacy control set for photo_library data.
#
# ── ON THE SHARED SPELLINGS ─────────────────────────────────────────────────
#
# `consent_prompt` and `usage_description` also appear in other platform catalogs. That is
# not duplication to be factored out: spec §2 (line 40) makes a control key "unique within
# — and namespaced by — its owning `domain`", so each is a DIFFERENT key that shares a
# spelling, and its meaning is the one its own domain gives it. A consent prompt for
# photo_library is not the consent prompt for anything else, and a receipt naming one must not
# be readable as the other.
#
# ⚠ `kind` is DOCUMENTATION today — nothing enforces it. See the data_residency catalog's
# header for the derivation note.

[domain]
name = "photo_library"
description = "Controls governing photo-library access — the consent, declaration, selection-scope, locality and metadata obligations a library read must satisfy."

[control.consent_prompt]
kind = "obligation"
title = "Photo-library consent prompt cleared"
description = "The subject was prompted for library access and consented before the read proceeded."

[control.usage_description]
kind = "obligation"
title = "Photo-library usage description declared"
description = "The application declares why it reads the library in the platform's usage-description surface."

[control.limited_selection]
kind = "obligation"
title = "Access limited to a subject-chosen selection"
description = "The application receives only the items the subject picked, not the whole library. The control that makes \"access photos\" mean a selection rather than a corpus, and the reason a full-library grant is a different decision."

[control.on_device_only]
kind = "obligation"
title = "Library content stays on device"
description = "Photo content is processed on the device and not sent off it. Reads like a prohibition; an obligation here for the rule-1 reason (shipped packs place it in requirement tables)."

[control.no_location_egress]
kind = "obligation"
title = "Embedded location withheld"
description = "Location embedded in image metadata is stripped or withheld rather than forwarded. A separate key from `on_device_only` because a deployment may legitimately send an image off device while still never sending where it was taken — and the metadata subject is where that distinction is decided."

# RLPS Control Catalog — domain: credential_use
#
# The canonical, jurisdiction-neutral declaration of the control keys a credential-use
# pack may reference, each with a deontic KIND and faceted sub-fields. Packs reference
# these keys; they do NOT redefine them. NOT LEGAL ADVICE — a control is a stable
# identifier for a required (or forbidden) action, not a statement of any jurisdiction's
# law, and satisfying every control here is not a finding that any credential use is
# lawful. See /docs/not-legal-advice.md.
#
# kind ∈ { permit | obligation | prohibition }
#
# ── THE BOUNDARY, because this domain makes it easy to forget ────────────────
#
# RLPS answers WHICH controls are required. It never answers whether one is satisfied.
# Nothing here holds a secret, resolves a pointer, or verifies an attestation: that is
# the enforcing gate in the consuming application, and the pointer lives there too. A
# key below is a name for an obligation the gate discharges, so a key whose satisfier
# is unwired is INDISTINGUISHABLE here from one fully wired — by design. A gate that
# cannot satisfy a required control must refuse the operation and say which control.
#
# ── WHY HALF OF THIS CATALOG IS PROHIBITIONS ────────────────────────────────
#
# "The secret value must never enter agent context" is not an obligation with a
# satisfier; it is a state that must never obtain. An obligation can be satisfied while
# something else still puts the value in context. A `prohibition` is subtracted from
# every resolved set under every posture, so no pack may require it and no posture may
# add it.
#
# ⚠ TWO RULES ON PROHIBITION KEYS, both load-bearing, both cheap to get wrong:
#
#   1. A prohibition key MUST NOT appear in `[legally_required]`, in a `[subject.*]`
#      table, or anywhere else a pack states a requirement. A pack that both requires
#      and forbids a control is not satisfiable.
#
#   2. A prohibition key MUST NOT appear in the CALLER'S UNIVERSE at resolve time.
#      The universe is the requirement domain. Every fail-closed fallback — a missing,
#      malformed, out-of-envelope or floor-less pack — resolves to the caller's entire
#      universe, and that path has no pack to read `[prohibited]` from, so it cannot
#      subtract anything. A prohibition key placed in the universe therefore becomes
#      REQUIRED at exactly the moment resolution fails. Conformance vector
#      `fallback_cannot_subtract_prohibited_controls` (level 2) pins this.
#
# The corollary a consuming gate must carry: falling back over-requires AND
# under-forbids. `provenance.fell_back = true` means "the prohibitions were not
# applied." A protection that lives only in pack data is absent precisely when the pack
# cannot be read, so the value-protecting prohibitions have to be structural in the
# enforcing layer as well.

[domain]
name = "credential_use"
description = "Controls governing whether and how an automated agent may USE a held secret — a credential redeemed by reference, never by value."

# ── Obligations — required for a redeem to proceed ───────────────────────────

[control.secret_by_reference_only]
kind = "obligation"
title = "Secret used by reference"
description = "The operation receives an opaque reference to the secret and never its value. The enforcing layer resolves the reference; the requesting agent holds only the pointer."
trigger = "before_redeem"
mechanism = "pointer_indirection"

[control.secret_pointer_notarized]
kind = "obligation"
title = "Pointer notarized"
description = "The reference carries a verifiable provenance record binding it to the grant that created it, so a pointer cannot be forged or replayed from elsewhere."
trigger = "before_redeem"
mechanism = "notarized_provenance_record"

[control.secret_principal_signed_attestation]
kind = "obligation"
title = "Principal-signed authorization"
description = "The redeem is authorized by an attestation the principal's own key signed. A notary-attested authorization is NOT interchangeable and does not satisfy this control; a gate requiring it refuses the weaker mode before doing verification work, rather than discovering the downgrade afterward. See /docs/aph-integration.md for why the two modes are separate keys there and why collapsing them is the defect to avoid."
trigger = "before_redeem"
mechanism = "principal_signed_attestation"

[control.secret_human_present_confirm]
kind = "obligation"
title = "Human presence confirmed"
description = "A human is confirmed present and consenting at redeem time, not merely at grant time. Satisfied by the enforcing layer's interactive resolve gate for the secret's class; the control asserts that gate was cleared, and does not name which tier cleared it."
trigger = "before_redeem"
mechanism = "interactive_resolve_gate"

[control.secret_ttl_bounded]
kind = "obligation"
title = "Redeem window bounded"
description = "The reference is valid only within a bounded window and cannot be redeemed outside it. An unbounded pointer is a durable credential wearing a pointer's name."
trigger = "before_redeem"
mechanism = "bounded_validity_window"

[control.secret_redeem_audience_bound]
kind = "obligation"
title = "Redeem bound to an audience"
description = "The reference names the party and operation it may be redeemed for, and is refused for any other. Without this, a leaked pointer is usable by whoever holds it."
trigger = "before_redeem"
mechanism = "audience_bound_reference"

[control.secret_assurance_floor]
kind = "obligation"
title = "Custody assurance floor met"
description = "The secret's custody meets the required assurance floor for its class. The floor and its ordering live in the enforcing layer's field policy; this control asserts that floor was CONSULTED and met. It deliberately does not encode a level — a control key is opaque and carries no value, so a key per level would be the only alternative and would put policy in the vocabulary."
trigger = "before_redeem"
mechanism = "field_policy_assurance_floor"

# ── Prohibitions — states that must never obtain ─────────────────────────────
#
# Per rule 1 above, none of these may appear in any requirement table. Per rule 2,
# none may appear in the caller's universe.

[control.secret_value_in_agent_context]
kind = "prohibition"
title = "Secret value in agent context"
description = "The secret's plaintext value appearing in an agent's context window, prompt, or transcript. Forbidden outright: a value that has entered context cannot be withdrawn from it, and every downstream copy inherits the exposure."
trigger = "always"
mechanism = "context_exclusion"

[control.secret_inline_value_argument]
kind = "prohibition"
title = "Secret as an inline argument"
description = "The secret's value passed as a tool-call or function argument. Distinct from the control above because an argument is frequently logged, echoed in a trace, or persisted by machinery that never sees itself as handling secrets."
trigger = "always"
mechanism = "argument_exclusion"

[control.secret_keyed_local_owner_redeem]
kind = "prohibition"
title = "Redeem by the keyed local owner alone"
description = "A redeem authorized solely by possession of the local owner's key. Possession of a device key is not evidence that a human authorized this act; an enrolled identity carrying an entitlement, or a confirmed human presence, is required instead."
trigger = "always"
mechanism = "owner_key_alone_refused"

[control.secret_remote_agent_redeem]
kind = "prohibition"
title = "Redeem by a remote agent"
description = "A redeem performed by an agent executing outside the trust boundary that holds the secret. Expressed as a prohibition rather than as a requirement that the agent be local: the prohibition is subtracted under every posture, where a requirement could be satisfied by a permissive pack while a remote path remained open."
trigger = "always"
mechanism = "remote_redeem_refused"

[control.secret_in_durable_shared_store]
kind = "prohibition"
title = "Secret value in a durable shared store"
description = "The secret's value written to any durable or shared surface — a ledger, an issue or plan comment, a note, a design document, a commit message, or a log. These surfaces are replicated, indexed, and long-lived, so an exposure here is effectively permanent and is rarely noticed at the time of writing."
trigger = "always"
mechanism = "durable_store_exclusion"

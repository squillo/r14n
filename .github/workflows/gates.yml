# RLPS gates — all tests (incl. the schema-vs-producers conformance suite, a Rust test in
# tools/tests/schema_conformance.rs) + the shipped-packs lint + the sanitization gate, on every
# push/PR. No path filters on purpose: every job here is an always-run check, so branch
# protection can require them without wedging unrelated PRs on Expected. Rust only — no Python.
# NOT LEGAL ADVICE.
name: gates

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The publication-hygiene gate: greps tracked files for internal markers that must never ship
  # in a public tree — internal design-doc ids, private component names, dev paths, session ids,
  # personal emails, and AI-authorship markers. `.github` is excluded because this workflow
  # necessarily contains every pattern as data. `git grep` exits 1 on "no matches", which is the
  # PASS condition; any other non-zero exit is an error and must not pass.
  sanitization:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the commit-message scan below walks history, and the
      # default shallow checkout would give it one commit to look at.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: no internal references in tracked files
        run: |
          set +e
          fail=0
          scan() {
            git grep -InE "$1" -- ':!.github' ; status=$?
            if [ $status -eq 0 ]; then
              echo "::error::forbidden pattern group matched: $2"
              fail=1
            elif [ $status -ne 1 ]; then
              echo "::error::git grep errored (exit $status) scanning: $2"
              fail=1
            fi
          }
          # Group 1 — internal numbering / design-doc schemes
          scan 'PRD-[0-9]|N_BOOK|SQUILLO_BOOK|nlang_x|HANDOFF|DEFERRED-PLAN' 'internal doc schemes'
          # Group 2 — internal component names, identities, session ids, dev paths
          scan 'squillo_[a-z]|wf_[0-9a-f]{6,}|scottwyatt86|scott@squillo\.com|squillo\.io|/Users/|~/@squillo' 'internal names/paths/identities'
          # Group 3 — outside-vendor / internal-tooling markers. The trailer NAME
          # is not banned here: this project attributes machine-assisted work to
          # its own identity (see the commit-message step below), and the docs
          # have to be able to state that rule. What is banned is any outside
          # vendor's name or address.
          scan 'Claude|Anthropic|Generated with|claude\.ai|noreply@anthropic\.com|\.claude/|MEMORY\.md' 'vendor/tooling markers'
          exit $fail

      # COMMIT MESSAGES, not just file contents. `git grep` reads tracked FILES
      # and never looks at commit messages, so a vendor trailer could — and did,
      # until 2026-09-03 — pass every check above while the forge parsed it as
      # co-authorship and put an outside party on this repository's public
      # contributor list. The trailer is metadata: it leaves no trace in any
      # file, so only this scan can see it.
      #
      # THE RULE: co-authorship names Squillo's own identity and nobody else.
      # Machine-assisted work is attributed to
      # `Squillo Code <320728527+squillo-code@users.noreply.github.com>`, which
      # is the organization that is accountable for the change. An outside
      # vendor is never named — not in a trailer, not in the prose.
      # `Signed-off-by` is separate and required: DCO, naming the human who
      # certifies the contribution.
      #
      # A tag or any other ref that still points at a pre-rewrite commit keeps
      # that whole lineage reachable, so this runs over FULL history on push
      # (fetch-depth: 0 above), not just the tip.
      - name: commit-message attribution is Squillo's own
        run: |
          set +e
          range="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          fi
          bad=0
          for sha in $(git rev-list --no-merges "$range"); do
            msg="$(git log -1 --format='%B' "$sha")"
            # Co-author lines naming anyone other than Squillo Code. Captured
            # into a variable first, deliberately: an inverted grep on EMPTY
            # input does not reliably exit non-zero across implementations, so
            # piping straight into `grep -qv` flags every commit that carries no
            # trailer at all. That bug shipped once; the guard prevents it.
            coauthors="$(printf '%s' "$msg" | grep -iE '^[[:space:]]*co-authored-by:')"
            if [ -n "$coauthors" ] \
               && printf '%s\n' "$coauthors" | grep -qvE 'squillo-code@users\.noreply\.github\.com'; then
              echo "::error::commit $sha credits someone other than Squillo Code — use 'Co-Authored-By: Squillo Code <320728527+squillo-code@users.noreply.github.com>'"
              bad=1
            fi
            # Any other attribution trailer form, whoever it names.
            if printf '%s' "$msg" \
                 | grep -qiE '^[[:space:]]*(generated-with|generated-by|assisted-by|authored-by)[[:space:]]*:'; then
              echo "::error::commit $sha carries a non-standard attribution trailer — only Co-Authored-By (Squillo Code) and Signed-off-by are allowed"
              bad=1
            fi
            # Outside-vendor names anywhere in the message, trailer or prose.
            if printf '%s' "$msg" | grep -qiE 'anthropic|claude|copilot|chatgpt|generated with'; then
              echo "::error::commit $sha names an outside tool or vendor — attribute to Squillo Code instead"
              bad=1
            fi
          done
          exit $bad

  resolver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resolver
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: resolver
      - run: cargo test --locked

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools
      - name: tools test suite
        run: cargo test --locked
        working-directory: tools
      # Driven by what is on disk, never by a hand-maintained list. The previous version
      # named three pack files explicitly, so a pack added without editing this step was
      # shipped unvalidated — the same shape as a source file no index declares. Both
      # directions are checked: every pack reaches its domain's catalog, and no pack
      # exists whose domain has no catalog to validate it against.
      - name: lint the shipped packs
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          fail=0
          for cat in catalog/*.catalog.toml; do
            domain="$(basename "$cat" .catalog.toml)"
            # NUL-delimited into xargs: no reliance on word-splitting, which differs
            # between shells and would pass every path as one argument in some of them.
            # `--catalog` is accepted before the pack list, so xargs can append paths.
            count=$(find packs -type f -name "${domain}.r14n.toml" | wc -l | tr -d ' ')
            if [ "$count" -eq 0 ]; then
              echo "::notice::catalog $domain has no packs yet — nothing to validate"
              continue
            fi
            echo "── $domain: $count pack(s)"
            find packs -type f -name "${domain}.r14n.toml" -print0 \
              | sort -z \
              | xargs -0 -r cargo run --quiet --manifest-path tools/Cargo.toml -- \
                  validate --catalog "$cat" || fail=1
          done
          # A pack whose domain has no catalog can never be validated at all.
          for p in $(find packs -type f -name '*.r14n.toml' | sort); do
            d="$(basename "$p" .r14n.toml)"
            if [ ! -f "catalog/${d}.catalog.toml" ]; then
              echo "::error::$p has no catalog/${d}.catalog.toml — it ships unvalidated"
              fail=1
            fi
          done
          exit $fail

  # Schema-vs-producers validation runs inside the `tools` job above
  # (tools/tests/schema_conformance.rs) — no separate job / no Python needed.

  # The JS/TS binding, with no hand-written JavaScript anywhere in the path: the
  # package is staged by the Rust CLI (`r14n package-npm`) and the wasm ABI is
  # tested by Rust (`wasm_bindgen_test`) running the real .wasm under Node. The
  # boundary's LOGIC is pinned by the resolver job (r14n::wire tests); what this
  # proves is that the ABI works under a real Node runtime and that the staged
  # package is COMPLETE — `package-npm` refuses a manifest that promises a file
  # the stage lacks, because nothing here executes the published bundle itself.
  bindings-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            bindings/wasm
            tools
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: wasm-pack
      - name: stage the npm package from the Rust core
        run: cargo run --quiet --locked --manifest-path tools/Cargo.toml -- package-npm
      # Node 20 is the floor the package supports; 22 is current LTS. The
      # binding is wasm + generated glue, so both runtimes exercise the same
      # bytes — a version that stops loading them is the failure we want caught.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: wasm ABI tests under Node 20
        run: wasm-pack test --node bindings/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: wasm ABI tests under Node 22 (LTS)
        run: wasm-pack test --node bindings/wasm

  # The r14n.squillo.com Worker (site/worker), a standalone crate with its own lockfile. Its
  # routing table is pure, so `cargo test` pins the behaviour of the live Worker on the host
  # (the recorded 20-request matrix) with no WASM runtime. The last step proves the crate also
  # compiles for the Workers target, with the SAME flags the deployed build uses: a table that
  # passes on the host but does not build for wasm32 is not a Worker.
  site-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: site/worker
      - name: routing table parity (host)
        run: cargo test --locked --manifest-path site/worker/Cargo.toml
      - name: clippy (warnings are errors)
        run: cargo clippy --locked --manifest-path site/worker/Cargo.toml --all-targets -- -D warnings
      - name: compiles for the Workers target
        env:
          RUSTFLAGS: -C target-feature=+reference-types,+multivalue
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path site/worker/Cargo.toml

  # The Python binding. Its tests are Rust (bindings/python/tests/python_surface.rs): they drive
  # the shim's own module object through an embedded CPython, so no Python source is hand-written
  # anywhere. That needs a Python shipping a shared libpython, which setup-python provides. The
  # logic underneath is a thin #[pyfunction] shim over r14n::wire, which the resolver job tests;
  # these cover only what the shim adds (names, the dial's None default, the exception type).
  # One Python version only, deliberately: the wheel is abi3 (3.9+), so a matrix would rebuild
  # the same stable-ABI artifact and prove nothing new. The wheel is still built, and checked
  # to be one abi3 wheel — the property "one wheel serves every Python" rests on.
  bindings-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bindings/python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: test the exported Python surface
        run: cargo test --locked --manifest-path bindings/python/Cargo.toml
      - name: build the wheel from the Rust core
        run: |
          python -m pip install --quiet 'maturin>=1.7,<2.0'
          maturin build --release --manifest-path bindings/python/Cargo.toml --out dist/wheels
      - name: the build is exactly one abi3 wheel
        run: |
          wheels=(dist/wheels/r14n-*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "::error::expected exactly one wheel, found ${#wheels[@]}"; exit 1; }
          case "${wheels[0]}" in
            *-abi3-*) echo "ok: ${wheels[0]}" ;;
            *) echo "::error::${wheels[0]} is not an abi3 wheel — one build would no longer serve every Python"; exit 1 ;;
          esac

  # No rustfmt gate on purpose: the tree follows a documented hand-rolled house style
  # (CONTRIBUTING.md — fully-qualified paths, 2-space indent) that rustfmt would rewrite.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            resolver
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clippy (warnings are errors)
        run: |
          cargo clippy --manifest-path resolver/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path tools/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path bindings/wasm/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets -- -D warnings

  # Verifies the rust-version declared in both Cargo.tomls actually builds — a stated MSRV that
  # CI never exercises is a claim, not a guarantee.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            resolver
            tools
      - run: cargo check --locked --manifest-path resolver/Cargo.toml
      - run: cargo check --locked --manifest-path tools/Cargo.toml

  # DCO: CONTRIBUTING.md requires a Signed-off-by trailer on every commit. PR-scoped so history
  # predating the rule does not wedge the gate.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit carries Signed-off-by
        run: |
          bad=0
          for sha in $(git rev-list --no-merges \
              ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: '; then
              echo "::error::commit $sha is missing a Signed-off-by trailer (git commit -s)"
              bad=1
            fi
          done
          exit $bad

  coverage:
    # Non-gating: publishes a coverage number for the reference implementation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-llvm-cov
      - name: resolver coverage
        run: cargo llvm-cov --summary-only
        working-directory: resolver
      - name: tools coverage
        run: cargo llvm-cov --summary-only
        working-directory: tools

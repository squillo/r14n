# RLPS pack-lifecycle CLI (maintainer-notes roadmap item 5): extract / merge / validate /
# sign / verify / keygen / publish. The `validate` subcommand is the LINTER that
# enforces the cross-file rules pack.schema.json can only document (attorney-of-
# record fields on approved packs, prohibited∩floor, catalog membership).
#
# `publish` writes ONLY the local /registry/index.json — any network publication
# is manual and counsel-gated (repo constraint). NOT LEGAL ADVICE.
#
# License: Apache-2.0 (code).

[package]
name = "r14n-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
description = "RLPS pack-lifecycle CLI: extract, merge, validate, sign, verify, keygen, publish (local registry index)"
repository = "https://github.com/squillo/r14n"

[[bin]]
name = "r14n"
path = "src/main.rs"

[dependencies]
r14n = { path = "../resolver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

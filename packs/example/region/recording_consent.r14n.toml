#
# This pack exists ONLY to demonstrate the profile GRAMMAR: a profile is a
# `<regime>/<jurisdiction>/<subjurisdiction>` hierarchical tag (spec §2.4), so on
# disk it lives at `packs/<regime>/<jurisdiction>/<domain>.r14n.toml`. Here the
# profile is the deliberately-fictional `example/region` — NOT `gdpr/eu`,
# `wiretap/us`, or any real regime. Real-jurisdiction packs are counsel-gated
# and held out of this repository (see README + spec §Governance).
#
# It is `status = "draft"` and makes no legal representation whatsoever.
# See docs/not-legal-advice.md.

[meta]
strictness = "as_configured"
description = "GRAMMAR EXAMPLE ONLY — fictional example/region profile, not a jurisdiction claim."

[meta.legal_review]
status = "draft"

[subject.telepresence]
controls = ["signal_notice", "indicator_mount"]

[subject.twin_attend]
controls = ["announcement", "aph_mandate_principal_signed"]

# The fail-closed floor.
[legally_required]
controls = ["attestation"]

# ⚠ NOT LEGAL ADVICE — this pack is a machine-readable template of controls, not a
# statement of any jurisdiction's law. Selecting `minimal` for a real jurisdiction is
# the consuming operator's liability. See docs/not-legal-advice.md.
# Regulatory policy pack — domain: credential_use — profile: minimal
#
# The floor: `strictness = "minimal"` requires ONLY [legally_required]. Subject tables
# are retained for readability but IGNORED under minimal strictness.
#
# ── WHY THIS FLOOR IS EXACTLY ONE CONTROL, AND WHY IT IS THAT ONE ────────────
#
# `secret_by_reference_only` is the control whose absence makes the entire domain
# meaningless: if the value reaches the agent, nothing else in this catalog matters.
# Every other obligation protects a redeem that is already indirect. So the floor is
# the one control that must hold even where counsel has confirmed the minimum.
#
# The floor is NOT empty, and must never become empty. A `minimal` pack with a missing
# or empty [legally_required] does not resolve to "nothing required" — it fails closed
# to the caller's entire universe with `fell_back = true`, discarding this pack whole.
# That is the correct safety behaviour, and it also means an empty floor here would
# silently discard the prohibitions below, which is the one thing this profile most
# needs to keep.
#
# ── WHY A LEAST-RESTRICTIVE PROFILE STILL FORBIDS THINGS ─────────────────────
#
# A prohibition is not a relaxable requirement. The three below describe states that
# must never obtain at any posture: the value in an agent's context, the value as an
# inline argument, the value in a durable or shared store. Each is irreversible once it
# happens — a value that has entered a context window or a replicated log cannot be
# withdrawn. So they are retained verbatim from the aggressive profile; `minimal`
# relaxes what must be DONE, never what must never HAPPEN.
#
# ⚠ These keys must never appear in [legally_required], in a [subject.*] table, or in
# the caller's declared universe at resolve time. A fail-closed fallback resolves to
# that universe whole and has no pack to subtract from, so a prohibition key placed
# there becomes REQUIRED exactly when resolution fails. See the catalog header.

[meta]
strictness = "minimal"
description = "Least-restrictive floor — the secret is used by reference, and the value never reaches context, arguments, or a durable store."

[meta.legal_review]
status = "requires_signoff"
counsel = "TBD"

# Only this is enforced under minimal strictness.
[legally_required]
controls = ["secret_by_reference_only"]

# Subtracted from every resolved set under every posture. Must not intersect the floor
# above — a pack that both requires and forbids a control is not satisfiable.
[prohibited]
controls = [
  "secret_value_in_agent_context",
  "secret_inline_value_argument",
  "secret_in_durable_shared_store",
]

# ── Subjects — one per secret class ──────────────────────────────────────────
#
# The subject is this domain's per-key dimension, so a secret CLASS is a subject rather
# than a variant of a control key. Only classes whose custody actually steps up on
# resolve are named here; a subject for a class that resolves ungated would read as
# protection that is not there. Classes deliberately held out, pending step-up arms in
# the enforcing layer: iban, api_key, bearer_token, oauth_token.

[subject.private_key]
controls = ["secret_by_reference_only", "secret_principal_signed_attestation", "secret_human_present_confirm"]

[subject.crypto_wallet_seed]
controls = ["secret_by_reference_only", "secret_principal_signed_attestation", "secret_human_present_confirm"]

[subject.passkey]
controls = ["secret_by_reference_only", "secret_human_present_confirm"]

[subject.credit_card]
controls = ["secret_by_reference_only", "secret_human_present_confirm"]

[subject.passport]
controls = ["secret_by_reference_only", "secret_human_present_confirm"]

[subject.website_login]
controls = ["secret_by_reference_only", "secret_human_present_confirm"]

[subject.member_share_key]
controls = ["secret_by_reference_only", "secret_human_present_confirm"]

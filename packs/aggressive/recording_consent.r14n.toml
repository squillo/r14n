# Regulatory policy pack — domain: recording_consent — profile: aggressive
#
# The fail-closed baseline. `strictness = "aggressive"` means the caller's full
# declared control UNIVERSE is required regardless of the tables below — ship this
# until licensed counsel signs a relaxed per-jurisdiction pack.
#
# Control vocabulary (declared in catalog/recording_consent.catalog.toml):
#   attestation      — user affirms consent / a lawful right to record
#   signal_notice    — conference recording signal verified active
#   indicator_mount  — local recording indicator verified mounted
#   announcement     — in-meeting "an assistant is present" announcement
#   aph_mandate      — a standing delegate/agent authorization mandate is present

[meta]
strictness = "aggressive"
description = "Fail-closed baseline — the full per-rail control universe, every jurisdiction."

[meta.legal_review]
status = "not_required"   # aggressive over-restricts; never under-restricts

[subject.local_piggyback]
controls = ["attestation", "aph_mandate"]

[subject.telepresence]
controls = ["signal_notice", "indicator_mount", "aph_mandate"]

[subject.twin_attend]
controls = ["announcement", "aph_mandate"]

[subject.import]
controls = ["attestation", "aph_mandate"]

[legally_required]
controls = ["attestation", "signal_notice", "indicator_mount", "announcement", "aph_mandate"]
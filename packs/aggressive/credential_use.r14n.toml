# ⚠ NOT LEGAL ADVICE — this pack is a machine-readable template of controls, not a
# statement of any jurisdiction's law. **"aggressive" ≠ "compliant"**: this profile
# over-restricts on purpose and asserts nothing about what any law requires.
# See docs/not-legal-advice.md.
# Regulatory policy pack — domain: credential_use — profile: aggressive
#
# ── WHAT `aggressive` ACTUALLY RESOLVES TO, which is not what it looks like ──
#
# Under `strictness = "aggressive"` the resolver requires the CALLER'S ENTIRE DECLARED
# UNIVERSE, not the tables in this file. So the floor and the subject tables below are
# documentation of intent, and the only part of this pack that changes a resolved set
# is [prohibited] — which IS subtracted, under every posture including this one.
#
# That is worth stating plainly, because it is easy to read a long [legally_required]
# list here as the thing doing the work. It is not. If the caller declares a universe
# narrower than this list, the extra controls are simply absent from the decision: the
# resolved set is always intersected with the caller's universe, since a pack can never
# demand a control the caller has no way to enforce.
#
# ── THE ONE ASYMMETRY A CONSUMING GATE MUST CARRY ────────────────────────────
#
# This profile is also the fail-closed FALLBACK posture — a missing, malformed,
# out-of-envelope, or floor-less pack degrades to aggressive-over-universe. But that
# fallback has no pack to read [prohibited] from, so it CANNOT subtract. Falling back
# therefore over-requires and under-forbids, and both paths report
# `strictness = "aggressive"`; only `provenance.fell_back` distinguishes them.
#
# So `fell_back = true` means "the prohibitions below were not applied." A protection
# that lives only in pack data is absent precisely when the pack cannot be read, which
# is why the value-protecting prohibitions must also be structural in the enforcing
# layer. Conformance vector `fallback_cannot_subtract_prohibited_controls` (level 2)
# pins this behaviour in both directions.

[meta]
strictness = "aggressive"
description = "Fail-closed baseline — every credential-use obligation, and every prohibition this domain defines."

[meta.legal_review]
status = "not_required"

# Documentation of intent under this profile (aggressive requires the caller's full
# universe regardless). A floor is MUST-provide for every pack, and it is the governing
# table the moment an operator selects `minimal` against this domain.
[legally_required]
controls = [
  "secret_by_reference_only",
  "secret_pointer_notarized",
  "secret_principal_signed_attestation",
  "secret_human_present_confirm",
  "secret_ttl_bounded",
  "secret_redeem_audience_bound",
  "secret_assurance_floor",
]

# Subtracted from every resolved set, including under aggressive. These must not appear
# in any table above, nor in the caller's declared universe — see the catalog header for
# why placing a prohibition key in the universe inverts it on fallback.
[prohibited]
controls = [
  "secret_value_in_agent_context",
  "secret_inline_value_argument",
  "secret_keyed_local_owner_redeem",
  "secret_remote_agent_redeem",
  "secret_in_durable_shared_store",
]

# ── Subjects — one per secret class ──────────────────────────────────────────
#
# The subject is this domain's per-key dimension, so a secret CLASS is a subject rather
# than a variant of a control key. Only classes whose custody actually steps up on
# resolve are named; a subject for a class that resolves ungated would read as
# protection that is not there. Held out pending step-up arms in the enforcing layer:
# iban, api_key, bearer_token, oauth_token.
#
# `secret_principal_signed_attestation` is required on the classes where possession of
# the secret is itself the authority to act — a signing key or a wallet seed — because
# for those a notary's assertion that the human approved is not the same claim as the
# human's own signature, and the difference is the whole point of keeping the two modes
# as separate control keys.

[subject.private_key]
controls = [
  "secret_by_reference_only",
  "secret_pointer_notarized",
  "secret_principal_signed_attestation",
  "secret_human_present_confirm",
  "secret_ttl_bounded",
  "secret_redeem_audience_bound",
  "secret_assurance_floor",
]


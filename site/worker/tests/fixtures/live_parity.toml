# SPDX-License-Identifier: Apache-2.0
#
# The live behaviour of https://r14n.squillo.com, recorded on 2026-11-02 with curl against the
# JavaScript Worker this crate replaces: one table per request. Twenty requests were recorded; the
# four that the static tier now answers (GET and HEAD of `/` and of the banner) are not here -- the
# platform serves them in front of this Worker, and `the_static_tier_declares_...` pins their
# headers instead. The other sixteen are replayed below. tests/parity.rs drives the routing
# table over every case and requires the answer to match, byte for byte where bytes are frozen.
#
# Request:  `method`, `path`, and optionally `accept` / `if_none_match` (raw header values).
# Response: `status`, then `[case.headers]` -- ONLY the headers the parity audit compares:
#           content-type, cache-control, etag, vary, allow, access-control-allow-origin. A header
#           absent from the table must be absent from the response, so an extra one fails too.
#           (The two additive headers this Worker sends are tested apart from this matrix.)
# Body:     `body` names what the bytes must be --
#             "none"    no body at all (HEAD, 304)
#             "jsonld"  ns/context.jsonld         "ttl"     ns/rlps.ttl
#             "text"    the literal `body_text`
#           -- compared with the repository file read fresh from disk. `body_bytes` and
#           `body_sha256_16` (first 16 hex of the live sha256) are the recorded live size and
#           digest, recorded for every body but ASSERTED only for the literal "text" bodies (the 404
#           and 405 texts, which exist nowhere else). A vocabulary body is pinned by equality with
#           the repository file instead, so an intentional edit to ns/ never fails against a stale
#           snapshot.

[[case]]
name = "post-root"
method = "POST"
path = "/"
status = 405
body = "text"
body_text = "method not allowed"
body_bytes = 18
body_sha256_16 = "be4fb6a21c324378"
[case.headers]
content-type = "text/plain;charset=UTF-8"
allow = "GET, HEAD"

[[case]]
name = "get-ns"
method = "GET"
path = "/ns"
status = 200
body = "jsonld"
body_bytes = 367
body_sha256_16 = "f61fd666dc4b97d1"
[case.headers]
content-type = "application/ld+json; charset=utf-8"
access-control-allow-origin = "*"
cache-control = "public, max-age=3600"
etag = '"f61fd666dc4b97d128122187215a4719"'
vary = "Accept"

[[case]]
name = "ns-turtle"
method = "GET"
